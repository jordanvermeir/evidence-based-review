<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec review</title>
<style>
/* Dossier styling: one passage at a time, with a review track as the header's anchor. */
:root {
  --paper: #f5f6f8;
  --surface: #ffffff;
  --ink: #1b2230;
  --ink-2: #4a5568;
  --ink-3: #7b8597;
  --rule: #dde1e8;
  --rule-strong: #c4cad5;
  --violet: #5a46d6;
  --violet-soft: rgba(90, 70, 214, 0.09);
  --violet-tint: rgba(90, 70, 214, 0.16);
  --violet-sel: rgba(90, 70, 214, 0.26);
  --ok: #23845a;
  --ok-soft: #e3f3ea;
  --warn: #a8650a;
  --warn-soft: #fbf0dc;
  --track-empty: #d5d9e1;
  --add-bg: #e3f7e8;
  --add-ln: #cdf0d6;
  --add-fg: #17663a;
  --del-bg: #fdecec;
  --del-ln: #f9d6d6;
  --del-fg: #9b1c24;
  --hunk-bg: #eef0f7;
  --fold-bg: #f0f2f5;
  --mention: rgba(214, 160, 30, 0.32);
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #12151c;
    --surface: #181c25;
    --ink: #e7eaf0;
    --ink-2: #b3bac7;
    --ink-3: #828b9b;
    --rule: #2a303c;
    --rule-strong: #3a4250;
    --violet: #a596ff;
    --violet-soft: rgba(165, 150, 255, 0.10);
    --violet-tint: rgba(165, 150, 255, 0.18);
    --violet-sel: rgba(165, 150, 255, 0.30);
    --ok: #4cc38a;
    --ok-soft: rgba(76, 195, 138, 0.14);
    --warn: #e0a54a;
    --warn-soft: rgba(224, 165, 74, 0.14);
    --track-empty: #343b48;
    --add-bg: rgba(46, 160, 67, 0.17);
    --add-ln: rgba(63, 185, 80, 0.28);
    --add-fg: #7ee2a0;
    --del-bg: rgba(248, 81, 73, 0.16);
    --del-ln: rgba(248, 81, 73, 0.28);
    --del-fg: #ffa3a0;
    --hunk-bg: rgba(130, 140, 200, 0.12);
    --fold-bg: #1f2430;
    --mention: rgba(214, 160, 30, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #12151c;
  --surface: #181c25;
  --ink: #e7eaf0;
  --ink-2: #b3bac7;
  --ink-3: #828b9b;
  --rule: #2a303c;
  --rule-strong: #3a4250;
  --violet: #a596ff;
  --violet-soft: rgba(165, 150, 255, 0.10);
  --violet-tint: rgba(165, 150, 255, 0.18);
  --violet-sel: rgba(165, 150, 255, 0.30);
  --ok: #4cc38a;
  --ok-soft: rgba(76, 195, 138, 0.14);
  --warn: #e0a54a;
  --warn-soft: rgba(224, 165, 74, 0.14);
  --track-empty: #343b48;
  --add-bg: rgba(46, 160, 67, 0.17);
  --add-ln: rgba(63, 185, 80, 0.28);
  --add-fg: #7ee2a0;
  --del-bg: rgba(248, 81, 73, 0.16);
  --del-ln: rgba(248, 81, 73, 0.28);
  --del-fg: #ffa3a0;
  --hunk-bg: rgba(130, 140, 200, 0.12);
  --fold-bg: #1f2430;
  --mention: rgba(214, 160, 30, 0.35);
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  display: flex;
  flex-direction: column;
}
button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  padding: 4px 12px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--ink-3); }
.theme-toggle { padding: 4px 7px; line-height: 0; }
.theme-toggle svg { display: block; }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.9em; }

/* ---------- message screens ---------- */
.message {
  margin: 15vh auto 0;
  max-width: 600px;
  padding: 28px 32px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
}
.message.error { border-color: var(--del-fg); }
.message pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }

/* ---------- header ---------- */
header.top {
  flex: none;
  position: relative;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 16px 28px 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px 24px;
  align-items: center;
}
.title-block h1 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 21px;
  line-height: 1.25;
  margin: 0;
}
.meta { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.header-right { justify-self: end; display: flex; gap: 8px; align-items: center; align-self: start; }
.warn-toggle { color: var(--warn); border-color: currentColor; background: var(--warn-soft); }
.warn-toggle.none { color: var(--ink-3); border-color: var(--rule); background: var(--surface); }

.trackrow {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 4px;
}
.track { flex: 1; display: flex; gap: 3px; align-items: center; height: 22px; min-width: 0; }
.track button {
  flex: 1 1 0;
  min-width: 4px;
  height: 8px;
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: var(--track-empty);
  transition: height 120ms ease;
}
.track button:hover:not(:disabled) { height: 14px; }
.track button.st-reviewed { background: var(--ok); }
.track button.st-attention { background: var(--warn); }
.track button.current { height: 20px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--violet); }
.nav { display: flex; gap: 8px; align-items: center; flex: none; }
.nav .pos { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 5.5em; text-align: center; }
.summaryrow {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 24px;
}
.summary { margin: 0; color: var(--ink-2); font-size: 13px; }
.summary b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.summary .s-ok { color: var(--ok); }
.summary .s-warn { color: var(--warn); }
.disclaimer {
  margin: 0;
  font-size: 12px;
  color: var(--ink-3);
}
.warn-panel {
  position: absolute;
  right: 28px;
  top: 52px;
  z-index: 20;
  width: min(720px, calc(100vw - 32px));
  max-height: 60vh;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 10px;
  padding: 6px 0;
  margin: 0;
  list-style: none;
  box-shadow: 0 12px 32px rgba(20, 24, 40, 0.18);
}
.warn-panel li { padding: 8px 16px; font-size: 13px; overflow-wrap: anywhere; border-left: 3px solid transparent; }
.warn-panel li + li { border-top: 1px solid var(--rule); }
.warn-panel li.clickable { cursor: pointer; }
.warn-panel li.clickable:hover, .warn-panel li.clickable:focus-visible { background: var(--paper); border-left-color: var(--warn); }

/* ---------- panes ---------- */
main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
}
.pane { overflow: auto; min-height: 0; }
.pane.spec-pane { background: var(--surface); border-right: 1px solid var(--rule); }
.pane.detail-pane { padding: 28px 32px 48px; }
@media (max-width: 900px) {
  html, body { height: auto; }
  body { display: block; }
  header.top { grid-template-columns: 1fr; padding: 14px 16px; }
  .header-right { justify-self: start; }
  .trackrow { flex-wrap: wrap; }
  .track { flex-basis: 100%; }
  main { display: block; }
  .pane.spec-pane { max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  .pane.detail-pane { overflow: visible; padding: 20px 16px 40px; }
  .warn-panel { right: 16px; }
}

/* ---------- spec (left): unchanged reading layout ---------- */
.spec { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 16px 0 32px; }
.sline { display: grid; grid-template-columns: 1.8em 3.4em minmax(0, 1fr); }
.sgut { text-align: center; font-weight: 700; user-select: none; }
.sgut .st-reviewed { color: var(--ok); }
.sgut .st-attention { color: var(--warn); }
.sno { text-align: right; padding-right: 12px; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums; }
.stext { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 16px; min-height: 1.6em; }
.sline.heading .stext { font-weight: 700; }
.seg.unlinked { color: var(--ink-3); }
.seg.linked { background: var(--violet-soft); cursor: pointer; border-radius: 2px; }
.seg.linked:hover { background: var(--violet-tint); }
.seg.linked.sel { background: var(--violet-sel); outline: 1px solid var(--violet); }
.seg.linked + .seg.linked { box-shadow: inset 2px 0 0 var(--violet); }

/* ---------- detail (right): the dossier ---------- */
.dossier { max-width: 1040px; }
.d-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px 24px;
  margin-bottom: 14px;
}
.el-id {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.005em;
}
.review { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.review button { border: 0; border-radius: 0; padding: 7px 14px; background: transparent; color: var(--ink-2); }
.review button + button { border-left: 1px solid var(--rule-strong); }
.review button:hover { background: var(--paper); }
.review button[aria-pressed="true"].rv-reviewed { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.review button[aria-pressed="true"].rv-attention { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.el-text {
  margin: 0;
  padding: 4px 0 4px 18px;
  border-left: 3px solid var(--violet);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-width: 88ch;
}
.gaps { margin: 14px 0 0; color: var(--ink-2); font-size: 13px; }
.gaps .badge { margin-right: 6px; }

.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 36px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
.section-head h3 { font-family: var(--serif); font-weight: 600; font-size: 19px; margin: 0; }
.section-head .count { color: var(--ink-3); font-size: 13px; }
.none-linked { color: var(--ink-3); margin: 4px 0; }

.badge {
  display: inline-block;
  font-size: 11.5px;
  line-height: 20px;
  padding: 0 8px;
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink-2);
  border: 1px solid var(--rule);
  white-space: nowrap;
}
.badge.b-new { color: var(--add-fg); border-color: currentColor; background: transparent; }
.badge.b-deleted { color: var(--del-fg); border-color: currentColor; background: transparent; }
.badge.b-limited { color: var(--warn); border-color: currentColor; background: transparent; }

.fileblock { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; margin: 0 0 16px; }
.fhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; padding: 10px 14px 10px 8px; align-items: center; }
.fileblock:not(.closed) .fhead { border-bottom: 1px solid var(--rule); }
.chev { grid-row: 1; border: 0; background: none; padding: 2px 6px; font-size: 11px; color: var(--ink-3); }
.ftitle { grid-row: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.fsym { font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--ink); }
.ftools { grid-row: 1; grid-column: 3; display: flex; gap: 8px; }
.fpath { grid-column: 2 / -1; font-family: var(--mono); font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.fpath .fname { color: var(--ink-2); }
.fnote { grid-column: 2 / -1; font-size: 12.5px; margin-top: 4px; }
.fnote.warn { color: var(--warn); }
.fnote.info { color: var(--ink-3); }
.fbody { overflow-x: auto; border-radius: 0 0 8px 8px; }
.fileblock.closed .fbody { display: none; }
.fmsg { padding: 14px 16px; color: var(--ink-2); font-size: 13px; }

/* ---------- diff: unchanged reading layout ---------- */
table.diff { border-collapse: collapse; font-family: var(--mono); font-size: 12px; line-height: 20px; min-width: 100%; tab-size: 4; -moz-tab-size: 4; }
table.diff td { padding: 0; vertical-align: top; }
td.ln { width: 1%; min-width: 44px; padding: 0 8px; text-align: right; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.mk { width: 1%; padding: 0 6px 0 10px; user-select: none; white-space: pre; }
td.code { white-space: pre; padding-right: 16px; }
tr.add td { background: var(--add-bg); }
tr.add td.ln { background: var(--add-ln); }
tr.add td.mk { color: var(--add-fg); }
tr.del td { background: var(--del-bg); }
tr.del td.ln { background: var(--del-ln); }
tr.del td.mk { color: var(--del-fg); }
tr.inrange td.ln:first-child { box-shadow: inset 3px 0 0 var(--violet); }
tr.mention td.code { background-image: linear-gradient(var(--mention), var(--mention)); }
.nonl { color: var(--del-fg); font-size: 11px; padding-left: 8px; user-select: none; }
tr.hunk td { background: var(--hunk-bg); color: var(--ink-3); padding: 2px 10px; white-space: pre; }
tr.fold td, tr.gap td { background: var(--fold-bg); color: var(--ink-2); padding: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.foldbar { position: sticky; left: 0; display: inline-flex; gap: 8px; align-items: center; padding: 5px 12px; font-family: var(--sans); font-size: 12.5px; white-space: nowrap; }
.foldbar button { padding: 1px 10px; font-size: 12px; }

@media (prefers-reduced-motion: reduce) { .track button { transition: none; } }
</style>
<script>
// Apply a saved light/dark choice before first paint; without one the page follows the system.
try {
  var savedTheme = localStorage.getItem("spec-review-theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
} catch (e) {}
</script>
</head>

<script type="application/json" id="mapping-data">{"version": 2, "diffSha256": "5eb7960d3a4d7064c596c1e1236059262d6962e41190ef94638429d80abdcc81", "title": "spring-petclinic-rest #329 — Paginated pet listing", "source": {"pullRequest": "https://github.com/spring-petclinic/spring-petclinic-rest/pull/329", "diff": "git diff -M -U999999 7690a61^1...pr-329"}, "elements": [{"id": "S0", "text": "# Paginated Pet Listing\n\n## Context\n\nVeterinary clinic staff and API consumers need to browse the pets registered in the clinic. As the number of pets grows, retrieving the entire list becomes inconvenient. Consumers need to request manageable portions of the list and navigate between them without losing track of the overall result set.\n\n## Goal\n\nProvide a paginated pet listing through the version 2 REST API, while maintaining the behavior of the existing pet-listing API for current consumers.\n\n## Functional requirements\n\n### Retrieving pets\n\n", "tests": [], "implementation": []}, {"id": "PET-001", "text": "**PET-001 — Paginated listing.** An API consumer can retrieve registered pets using `GET /api/v2/pets`. The response contains only the pets belonging to the requested page, rather than the complete collection.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/V2RestControllersTests.java", "symbol": "testGetPetsPageSuccess", "lines": "new:117-134"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:872-924"}, {"file": "src/main/java/org/springframework/samples/petclinic/service/ClinicServiceImpl.java", "symbol": "findPets", "lines": "new:71-75"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataPetRepository.java", "symbol": "findAll", "lines": "new:44-48"}], "reviewNote": "Endpoint exists; only a mocked controller test."}, {"id": "PET-002", "text": "**PET-002 — Page selection.** Consumers can specify the page using a zero-based `page` query parameter. Page `0` represents the first page; subsequent page numbers retrieve subsequent portions of the same ordered collection.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/V2RestControllersTests.java", "symbol": "testGetPetsPageSuccess", "lines": "new:117-134"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:872-924"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}], "reviewNote": "page is passed to PageRequest; repositories use the offset."}, {"id": "PET-003", "text": "**PET-003 — Page size.** Consumers can specify the maximum number of pets returned using a positive integer `size` query parameter. The number of pets returned must not exceed the requested size. The final page may contain fewer pets.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/V2RestControllersTests.java", "symbol": "testGetPetsPageSuccess", "lines": "new:117-134"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:872-924"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}], "reviewNote": "size is passed through; OpenAPI declares minimum 1, maximum 100 (spec has no maximum)."}, {"id": "PET-004", "text": "**PET-004 — Default paging.** When `page` or `size` is omitted, the API applies a consistent documented default for that parameter. The response must make the effective paging values clear.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:876-900"}, {"file": "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java", "symbol": "toPetPageDto", "lines": "new:43-51"}], "reviewNote": "Defaults 0/20 are set in both the controller and the OpenAPI contract; untested."}, {"id": "S5", "text": "### Ordering and page consistency\n\n", "tests": [], "implementation": []}, {"id": "PET-005", "text": "**PET-005 — Consistent ordering.** Pets must be returned in a consistent order so that successive pages can be browsed predictably. Repeating the same request against unchanged data produces the same ordering.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataPetRepository.java", "symbol": "findAll", "lines": "new:44-48"}], "reviewNote": "Ordering by id: hardcoded in JDBC/JPA, Sort.by(\"id\") in the controller for Spring Data."}, {"id": "PET-006", "text": "**PET-006 — Name ordering.** Consumers can request that pets be ordered alphabetically by name, either ascending or descending. Ordering is applied across the entire matching collection *before* the requested page is selected. Pets with identical names must have a deterministic relative order, preventing duplicates or omissions when navigating pages against unchanged data. When no ordering preference is provided, the default ordering is used.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:876-900"}], "reviewNote": "NOT IMPLEMENTED: no sort parameter; only id ordering exists."}, {"id": "S8", "text": "### Response information\n\n", "tests": [], "implementation": []}, {"id": "PET-007", "text": "**PET-007 — Pet details.** Each listed pet contains the pet information available to consumers of the existing pet-listing API. Pagination must not remove existing pet fields.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/V2RestControllersTests.java", "symbol": "testGetPetsPageSuccess", "lines": "new:117-134"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java", "symbol": "toPetPageDto", "lines": "new:43-51"}, {"file": "src/main/resources/openapi.yml", "symbol": "PetPage", "lines": "new:2109-2153"}], "reviewNote": "Content uses the same PetDto mapping as v1; the test checks only id and name."}, {"id": "PET-008", "text": "**PET-008 — Pagination metadata.** The response provides the current page number, configured page size, total number of matching pets, and total number of pages. Consumers can use this information to determine whether additional pages exist.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/V2RestControllersTests.java", "symbol": "testGetPetsPageSuccess", "lines": "new:117-134"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java", "symbol": "toPetPageDto", "lines": "new:43-51"}, {"file": "src/main/resources/openapi.yml", "symbol": "PetPage", "lines": "new:2109-2153"}], "reviewNote": "page, size, totalElements and totalPages are mapped and asserted."}, {"id": "PET-009", "text": "**PET-009 — Empty results.** When the clinic has no registered pets, the API returns a successful response with an empty pet list and coherent pagination metadata. A request for a page beyond the last available page also returns an empty list rather than pets from a different page.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java", "symbol": "toPetPageDto", "lines": "new:43-51"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}], "reviewNote": "Relies on Spring's PageImpl; no test for empty or out-of-range pages."}, {"id": "S12", "text": "### Compatibility and input handling\n\n", "tests": [], "implementation": []}, {"id": "PET-010", "text": "**PET-010 — Existing API compatibility.** The existing `GET /api/pets` endpoint retains its established behavior and response shape. Introducing the version 2 endpoint must not require existing consumers to change their requests.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/PetRestControllerV1Tests.java", "symbol": "testGetAllPetsSuccess", "lines": "new:127-141"}, {"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/PetRestControllerV1Tests.java", "symbol": "testGetAllPetsNotFound", "lines": "new:143-151"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/PetRestControllerV1.java", "symbol": "listPets", "lines": "new:62-70"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPets", "lines": "new:838-871"}], "reviewNote": "v1 controller only renamed/moved; path and response unchanged (including 404 on an empty list)."}, {"id": "PET-011", "text": "**PET-011 — Invalid paging input.** Negative page numbers, non-positive page sizes, and non-numeric paging values are rejected with a client error rather than being silently interpreted as valid requests.\n\n", "tests": [], "implementation": [{"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:876-900"}, {"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}], "reviewNote": "Only via OpenAPI minimum constraints on the generated interface; untested."}, {"id": "S15", "text": "## Acceptance scenarios\n\n", "tests": [], "implementation": []}, {"id": "AC-01", "text": "**AC-01 — First page.** Given 45 registered pets, when a consumer requests `GET /api/v2/pets?page=0\u0026size=20`, then the response contains 20 pets and reports 45 total pets across 3 pages.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/V2RestControllersTests.java", "symbol": "testGetPetsPageSuccess", "lines": "new:117-134"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}], "reviewNote": "No test with 45 pets / size 20; the closest test uses 2 pets, size 5."}, {"id": "AC-02", "text": "**AC-02 — Final page.** Given the same 45 pets, when a consumer requests page 2 with size 20, then the response contains the remaining 5 pets.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}], "reviewNote": "Untested."}, {"id": "AC-03", "text": "**AC-03 — Different pages.** Given an unchanged collection, when a consumer requests consecutive pages of the same size and ordering, then pets do not appear on more than one page.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataPetRepository.java", "symbol": "findAll", "lines": "new:44-48"}], "reviewNote": "Plausible with unique id ordering; untested."}, {"id": "AC-04", "text": "**AC-04 — Ascending names.** Given pets named Bella, Archie, Charlie, and Daisy, when the consumer requests ascending name ordering with page size 2, then the first page contains Archie and Bella, and the second contains Charlie and Daisy.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:876-900"}], "reviewNote": "NOT MET: no name ordering."}, {"id": "AC-05", "text": "**AC-05 — Descending names.** Given the same pets, when the consumer requests descending name ordering with page size 2, then the first page contains Daisy and Charlie.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:876-900"}], "reviewNote": "NOT MET: no name ordering."}, {"id": "AC-06", "text": "**AC-06 — Duplicate names.** Given multiple pets with the same name, when the consumer browses successive pages against unchanged data, then each pet appears exactly once.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/PetRestControllerV2.java", "symbol": "listPetsPage", "lines": "new:31-39"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataPetRepository.java", "symbol": "findAll", "lines": "new:44-48"}], "reviewNote": "Satisfied by id ordering only because name ordering does not exist; untested."}, {"id": "AC-07", "text": "**AC-07 — Empty clinic.** Given no registered pets, when the consumer requests the first page, then the result contains an empty list and reports zero total pets and zero total pages.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java", "symbol": "toPetPageDto", "lines": "new:43-51"}], "reviewNote": "Untested."}, {"id": "AC-08", "text": "**AC-08 — Out-of-range page.** Given 45 registered pets, when the consumer requests page 9 with size 20, then the response contains an empty list and still reports the correct collection totals.\n\n", "tests": [], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java", "symbol": "toPetPageDto", "lines": "new:43-51"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jdbc/JdbcPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:153-182"}, {"file": "src/main/java/org/springframework/samples/petclinic/repository/jpa/JpaPetRepositoryImpl.java", "symbol": "findAll", "lines": "new:78-87"}], "reviewNote": "Untested."}, {"id": "AC-09", "text": "**AC-09 — Invalid page.** When the consumer requests a negative page number or a page size of zero, then the API returns a client error.\n\n", "tests": [], "implementation": [{"file": "src/main/resources/openapi.yml", "symbol": "listPetsPage", "lines": "new:876-900"}], "reviewNote": "Depends on generated bean validation; untested."}, {"id": "AC-10", "text": "**AC-10 — Backward compatibility.** Given existing consumers using `GET /api/pets`, when the new paginated API becomes available, then the existing endpoint continues to return its established response.\n\n", "tests": [{"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/PetRestControllerV1Tests.java", "symbol": "testGetAllPetsSuccess", "lines": "new:127-141"}, {"file": "src/test/java/org/springframework/samples/petclinic/rest/controller/PetRestControllerV1Tests.java", "symbol": "testGetAllPetsNotFound", "lines": "new:143-151"}], "implementation": [{"file": "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/PetRestControllerV1.java", "symbol": "listPets", "lines": "new:62-70"}, {"file": "src/main/resources/openapi.yml", "symbol": "listPets", "lines": "new:838-871"}], "reviewNote": "Existing v1 test kept, only renamed."}, {"id": "S26", "text": "## Out of scope\n\nCreating, modifying, or deleting pets; filtering by owner or other attributes; and changes to existing pet records are outside this feature.\n", "tests": [], "implementation": []}]}</script>
<script type="application/json" id="diff-data">"diff --git a/pom.xml b/pom.xml\nindex 0e3f2c5..955ec6f 100644\n--- a/pom.xml\n+++ b/pom.xml\n@@ -1,473 +1,475 @@\n \u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n \u003cproject xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n          xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\u003e\n     \u003cmodelVersion\u003e4.0.0\u003c/modelVersion\u003e\n \n     \u003cgroupId\u003eorg.springframework.samples\u003c/groupId\u003e\n     \u003cartifactId\u003espring-petclinic-rest\u003c/artifactId\u003e\n     \u003cversion\u003e4.0.2\u003c/version\u003e\n \n     \u003cdescription\u003eREST version of the Spring Petclinic sample application\u003c/description\u003e\n     \u003curl\u003ehttps://spring-petclinic.github.io/\u003c/url\u003e\n \n     \u003cparent\u003e\n         \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n         \u003cartifactId\u003espring-boot-starter-parent\u003c/artifactId\u003e\n         \u003cversion\u003e4.0.6\u003c/version\u003e\n         \u003crelativePath/\u003e \u003c!-- lookup parent from Maven repository --\u003e\n     \u003c/parent\u003e\n \n     \u003cproperties\u003e\n \n         \u003c!-- Third-party libraries --\u003e\n         \u003cspring-data-jdbc.version\u003e1.2.1.RELEASE\u003c/spring-data-jdbc.version\u003e\n         \u003cspringdoc-openapi-ui.version\u003e3.0.3\u003c/springdoc-openapi-ui.version\u003e\n         \u003cjackson-databind-nullable.version\u003e0.2.10\u003c/jackson-databind-nullable.version\u003e\n         \u003cmapstruct.version\u003e1.6.3\u003c/mapstruct.version\u003e\n         \u003cjaxb-api.version\u003e2.3.1\u003c/jaxb-api.version\u003e\n \n         \u003c!-- Maven plugins and supporting properties --\u003e\n         \u003cmaven.checkstyle-plugin.version\u003e3.6.0\u003c/maven.checkstyle-plugin.version\u003e\n         \u003cmaven.exec-plugin.ver             span.setAttribute("aria-label", "Select " + el.id);
            span.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(el._index); }
            });
            var mk = h("span");
            gut.appendChild(mk);
            markerByEl.set(el._index, mk);
          }
        }
        started.add(el._index);
        segsByEl[s[0]].push(span);
        body.appendChild(span);
      });
      spec.appendChild(h("div", { class: "sline" + (heading ? " heading" : "") },
        gut, h("span", { class: "sno", text: String(ln + 1) }), body));
    });
    specPane.appendChild(spec);
  })();

  // ======================================================================
  // Selection, navigation, counts, review state
  // ======================================================================
  function select(i) {
    if (i === null || !elements[i] || !elements[i]._linked) return;
    if (selected !== null) segsByEl[selected].forEach(function (s) { s.classList.remove("sel"); });
    selected = i;
    segsByEl[i].forEach(function (s) { s.classList.add("sel"); });
    var first = segsByEl[i][0];
    if (first) scrollIntoPane(first, specPane);
    renderHeaderState();
    renderDetail();
    detailPane.scrollTop = 0;
  }

  function scrollIntoPane(node, pane) {
    var pr = pane.getBoundingClientRect(), nr = node.getBoundingClientRect();
    if (pane.scrollHeight > pane.clientHeight + 1) {
      if (nr.top < pr.top || nr.bottom > pr.bottom) {
        pane.scrollTop += nr.top - pr.top - pane.clientHeight / 3;
      }
    } else if (nr.top < 0 || nr.bottom > window.innerHeight) {
      node.scrollIntoView({ block: "center" });
    }
  }

  function step(delta) {
    if (!linked.length) return;
    var pos = linked.indexOf(selected);
    var next = Math.min(linked.length - 1, Math.max(0, pos + delta));
    if (next !== pos) select(linked[next]);
  }

  function renderHeaderState() {
    var pos = linked.indexOf(selected);
    posLabel.textContent = (pos + 1) + " of " + linked.length;
    prevBtn.disabled = pos <= 0;
    nextBtn.disabled = pos < 0 || pos >= linked.length - 1;

    var noTests = 0, noImpl = 0, nReviewed = 0, nAttention = 0;
    linked.forEach(function (i) {
      if (!elements[i].tests.length) noTests++;
      if (!elements[i].implementation.length) noImpl++;
      var st = review.get(i);
      if (st === "reviewed") nReviewed++;
      if (st === "attention") nAttention++;
    });
    countsEl.textContent = "";
    append(countsEl, [
      h("b", { text: String(linked.length) }), linked.length === 1 ? " linked passage: " : " linked passages: ",
      h("b", { text: String(noTests) }), " without tests, ",
      h("b", { text: String(noImpl) }), " without implementation. ",
      h("b", { class: nReviewed ? "s-ok" : "", text: String(nReviewed) }), " reviewed, ",
      h("b", { class: nAttention ? "s-warn" : "", text: String(nAttention) }),
      nAttention === 1 ? " needs attention." : " need attention."
    ]);

    trackBtns.forEach(function (b, k) {
      var i = linked[k], st = review.get(i);
      b.className = (st ? "st-" + st : "") + (i === selected ? " current" : "");
      b.title = elements[i].id + (st === "reviewed" ? ", reviewed" : st === "attention" ? ", needs attention" : "");
      b.setAttribute("aria-label", b.title);
      if (i === selected) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });

    markerByEl.forEach(function (mk, i) {
      var st = review.get(i);
      mk.className = st === "reviewed" ? "st-reviewed" : st === "attention" ? "st-attention" : "";
      mk.textContent = st === "reviewed" ? "✓" : st === "attention" ? "!" : "";
      mk.title = st === "reviewed" ? "Reviewed" : st === "attention" ? "Needs attention" : "";
    });
  }

  function setReview(i, state) {
    if (review.get(i) === state) review.delete(i); else review.set(i, state);
    renderHeaderState();
    renderDetail();
  }

  // ======================================================================
  // Detail pane
  // ======================================================================
  function renderDetail() {
    detailPane.textContent = "";
    if (selected === null) {
      detailPane.appendChild(h("p", { class: "none-linked", text: "No linked passages in this mapping." }));
      return;
    }
    var el = elements[selected];
    var st = review.get(selected);
    var reviewedBtn = h("button", {
      type: "button", class: "rv-reviewed", "aria-pressed": String(st === "reviewed"),
      onclick: function () { setReview(el._index, "reviewed"); }
    }, "✓ Reviewed");
    var attentionBtn = h("button", {
      type: "button", class: "rv-attention", "aria-pressed": String(st === "attention"),
      onclick: function () { setReview(el._index, "attention"); }
    }, "! Needs attention");

    var dossier = h("article", { class: "dossier" });
    detailPane.appendChild(dossier);
    append(dossier, [
      h("div", { class: "d-head" },
        h("h2", { class: "el-id", text: el.id }),
        h("div", { class: "review", role: "group", "aria-label": "Review status" }, reviewedBtn, attentionBtn)),
      h("pre", { class: "el-text", text: el.text })
    ]);
    var badges = [];
    if (!el.tests.length) badges.push(h("span", { class: "badge", text: "no tests linked" }));
    if (!el.implementation.length) badges.push(h("span", { class: "badge", text: "no implementation linked" }));
    if (badges.length) dossier.appendChild(h("p", { class: "gaps" }, badges));

    KINDS.forEach(function (kind) {
      var n = el[kind].length;
      dossier.appendChild(h("div", { class: "section-head" },
        h("h3", { text: kind === "tests" ? "Tests" : "Implementation" }),
        h("span", { class: "count", text: n ? n + " linked" : "" })));
      if (!n) {
        dossier.appendChild(h("p", { class: "none-linked", text: "None linked." }));
        return;
      }
      el[kind].forEach(function (ref, j) {
        dossier.appendChild(renderReference(el, kind, j, ref));
      });
    });
  }

  function getEntry(el, kind, j, ref) {
    var key = el._index + ":" + kind + ":" + j;
    var entry = entries.get(key);
    if (!entry) {
      var file = fileByPath.get(ref.file) || null;
      entry = { file: file, open: true };
      if (file && file.rows.length) {
        // Explicit lines win; when they can't be used, fall back to locating the symbol.
        var spec = ref.lines !== undefined ? parseLines(ref.lines) : null;
        var res = spec ? resolveLines(file, spec, ref.symbol) : null;
        if (res && res.ok) {
          entry.loc = { mode: "lines", ranges: res.ranges, label: spec.label };
        } else {
          entry.loc = locate(file, ref.symbol);
          if (res) entry.linesProblem = { problem: res.problem, label: spec.label };
        }
        entry.initial = initialVisibility(file, entry.loc);
        entry.vis = entry.initial.slice();
        entry.inRange = new Uint8Array(file.rows.length);
        if (entry.loc.mode !== "fallback") {
          entry.loc.ranges.forEach(function (r) { for (var i = r[0]; i <= r[1]; i++) entry.inRange[i] = 1; });
        }
      }
      entries.set(key, entry);
    }
    return entry;
  }

  function renderReference(el, kind, j, ref) {
    var entry = getEntry(el, kind, j, ref);
    var file = entry.file;
    var block = h("div", { class: "fileblock" + (entry.open ? "" : " closed") });
    var chev = h("button", {
      type: "button", class: "chev", "aria-expanded": String(entry.open),
      "aria-label": "Toggle file", text: entry.open ? "▼" : "▶"
    });
    chev.addEventListener("click", function () {
      entry.open = !entry.open;
      block.classList.toggle("closed", !entry.open);
      chev.textContent = entry.open ? "▼" : "▶";
      chev.setAttribute("aria-expanded", String(entry.open));
    });

    // Symbol first, path second; within the path the file name stands out from its directory.
    var slash = ref.file.lastIndexOf("/");
    var titleRow = h("div", { class: "ftitle" }, h("span", { class: "fsym", text: ref.symbol }));
    var tools = h("div", { class: "ftools" });
    var head = h("div", { class: "fhead" }, chev, titleRow, tools,
      h("div", { class: "fpath" },
        ref.file.slice(0, slash + 1),
        h("span", { class: "fname", text: ref.file.slice(slash + 1) })));
    block.appendChild(head);
    var body = h("div", { class: "fbody" });
    block.appendChild(body);

    if (!file) {
      body.appendChild(h("div", { class: "fmsg" }, withCode(["", ref.file,
        " is not in the diff. It may be unchanged in this change set."])));
      return block;
    }

    if (file.isNew) titleRow.appendChild(h("span", { class: "badge b-new", text: "new file" }));
    if (file.isDeleted) titleRow.appendChild(h("span", { class: "badge b-deleted", text: "deleted file" }));
    if (file.isRenamed) titleRow.appendChild(h("span", { class: "badge", text: "renamed", title: "from " + file.oldPath }));
    if (!file.complete) titleRow.appendChild(h("span", { class: "badge b-limited", text: "limited context" }));
    if (file.isBinary) titleRow.appendChild(h("span", { class: "badge", text: "binary" }));

    if (!file.rows.length) {
      body.appendChild(h("div", { class: "fmsg", text: file.isBinary
        ? "Binary file, no preview."
        : "No content changes (rename or mode change only)." }));
      return block;
    }

    var loc = entry.loc;
    var toggle = h("button", { type: "button" });
    tools.appendChild(toggle);
    if (file.isRenamed) {
      head.appendChild(h("div", { class: "fnote info" }, withCode(["Renamed from ", file.oldPath, ""])));
    }
    if (loc.mode === "lines") {
      head.appendChild(h("div", { class: "fnote info" },
        withCode(["Showing lines ", loc.label, " from the mapping."])));
    } else if (entry.linesProblem) {
      head.appendChild(h("div", { class: "fnote warn" }, withCode(entry.linesProblem.problem === "missing"
        ? ["⚠ Lines ", entry.linesProblem.label, " are not in the diff; locating the symbol instead."]
        : ["⚠ Symbol ", ref.symbol, " is not in lines " + entry.linesProblem.label + "; locating the symbol instead."])));
    }
    if (loc.mode === "fallback" && loc.found) {
      head.appendChild(h("div", { class: "fnote info" },
        withCode(["Declaration of ", ref.symbol, " not located; showing all changes."])));
    } else if (loc.mode === "fallback") {
      head.appendChild(h("div", { class: "fnote warn" },
        withCode(["⚠ Symbol ", ref.symbol, " not found in this file; showing all changes."])));
    } else if (loc.side === "old") {
      head.appendChild(h("div", { class: "fnote info" },
        withCode(["Declaration of ", ref.symbol, " found in removed lines."])));
    }

    function allVisible() {
      for (var i = 0; i < entry.vis.length; i++) if (!entry.vis[i]) return false;
      return true;
    }
    function initialIsAll() {
      for (var i = 0; i < entry.initial.length; i++) if (!entry.initial[i]) return false;
      return true;
    }
    function update() {
      body.textContent = "";
      body.appendChild(renderDiff(file, entry, update));
      var all = allVisible();
      toggle.disabled = all && initialIsAll();
      toggle.textContent = !all ? "Expand all"
        : loc.mode === "lines" ? "Collapse to lines"
        : loc.mode === "decl" ? "Collapse to symbol" : "Collapse to changes";
    }
    toggle.addEventListener("click", function () {
      entry.vis = allVisible() ? entry.initial.slice() : new Uint8Array(entry.vis.length).fill(1);
      update();
    });
    update();
    return block;
  }

  function renderDiff(file, entry, update) {
    var tbody = h("tbody");
    var table = h("table", { class: "diff" }, tbody);
    var mentions = entry.loc.mode === "fallback" ? entry.loc.mentions : null;
    var useOld = file.isDeleted;
    var prevEnd = 0; // last line number (on the numbering side) covered so far

    var runs = new Map();
    hiddenRuns(file, entry.vis).forEach(function (r) { runs.set(r[0], r[1]); });

    file.hunks.forEach(function (hk) {
      var start = useOld ? hk.oldStart : hk.newStart;
      var count = useOld ? hk.oldCount : hk.newCount;
      if (!file.complete && start > prevEnd + 1) {
        tbody.appendChild(h("tr", { class: "gap" }, h("td", { colspan: "4" },
          h("span", { class: "foldbar", text: (start - 1 === prevEnd + 1
            ? "⋯ line " + (start - 1)
            : "⋯ lines " + (prevEnd + 1) + "–" + (start - 1)) + " not in diff ⋯" }))));
      }
      prevEnd = count === 0 ? start : start + count - 1;
      tbody.appendChild(h("tr", { class: "hunk" }, h("td", { colspan: "4", text: hk.header })));

      for (var u = hk.start; u < hk.end; u++) {
        if (runs.has(u)) {
          var end = runs.get(u);
          tbody.appendChild(foldRow(file, entry, u, end, update));
          u = end - 1;
          continue;
        }
        var r = file.rows[u];
        var cls = r.type === "add" ? "add" : r.type === "del" ? "del" : "ctx";
        if (entry.inRange[u]) cls += " inrange";
        if (mentions && mentions.has(u)) cls += " mention";
        var code = h("td", { class: "code" }, r.text);
        if (r.noNewline) code.appendChild(h("span", { class: "nonl", text: "⊘ no newline at end of file" }));
        tbody.appendChild(h("tr", { class: cls },
          h("td", { class: "ln", text: r.oldNo === null ? "" : String(r.oldNo) }),
          h("td", { class: "ln", text: r.newNo === null ? "" : String(r.newNo) }),
          h("td", { class: "mk", text: r.type === "add" ? "+" : r.type === "del" ? "-" : " " }),
          code));
      }
    });
    return table;
  }

  function foldRow(file, entry, start, end, update) {
    var n = end - start, changed = 0;
    for (var i = start; i < end; i++) if (file.rows[i].type !== "context") changed++;
    function reveal(from, to) {
      for (var i = from; i < to; i++) entry.vis[i] = 1;
      normalize(file, entry.vis);
      update();
    }
    var bar = h("span", { class: "foldbar" },
      "⋯ " + n + (n === 1 ? " line" : " lines") + " hidden" + (changed ? " (" + changed + " changed)" : "") + " ⋯");
    if (n > STEP) {
      bar.appendChild(h("button", { type: "button", title: "Show " + STEP + " more lines above the next block",
        onclick: function () { reveal(end - STEP, end); } }, "↑ " + STEP));
      bar.appendChild(h("button", { type: "button", title: "Show " + STEP + " more lines below the previous block",
        onclick: function () { reveal(start, start + STEP); } }, "↓ " + STEP));
    }
    bar.appendChild(h("button", { type: "button", onclick: function () { reveal(start, end); } }, "Show all"));
    return h("tr", { class: "fold" }, h("td", { colspan: "4" }, bar));
  }

  // ======================================================================
  // Start
  // ======================================================================
  renderHeaderState();
  if (selected !== null) select(selected); else renderDetail();
})();
</script>
</body>
</html>

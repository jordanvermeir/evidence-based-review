<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec review</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f8fa;
  --bg-header: #f6f8fa;
  --fg: #1f2328;
  --fg-muted: #656d76;
  --fg-faint: #8c959f;
  --border: #d0d7de;
  --accent: #0969da;
  --link-tint: rgba(9, 105, 218, 0.08);
  --link-tint-hover: rgba(9, 105, 218, 0.16);
  --sel-tint: rgba(9, 105, 218, 0.24);
  --add-bg: #dafbe1;
  --add-ln: #ccffd8;
  --add-fg: #116329;
  --del-bg: #ffebe9;
  --del-ln: #ffd7d5;
  --del-fg: #82071e;
  --hunk-bg: #ddf4ff;
  --fold-bg: #eef1f4;
  --range: #0969da;
  --mention: rgba(212, 167, 44, 0.35);
  --warn-fg: #9a6700;
  --warn-bg: #fff8c5;
  --ok-fg: #1a7f37;
  --badge-bg: #eaeef2;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-header: #161b22;
    --fg: #e6edf3;
    --fg-muted: #8d96a0;
    --fg-faint: #6e7681;
    --border: #30363d;
    --accent: #4493f8;
    --link-tint: rgba(68, 147, 248, 0.10);
    --link-tint-hover: rgba(68, 147, 248, 0.20);
    --sel-tint: rgba(68, 147, 248, 0.32);
    --add-bg: rgba(46, 160, 67, 0.18);
    --add-ln: rgba(63, 185, 80, 0.30);
    --add-fg: #7ee787;
    --del-bg: rgba(248, 81, 73, 0.18);
    --del-ln: rgba(248, 81, 73, 0.30);
    --del-fg: #ffa198;
    --hunk-bg: rgba(56, 139, 253, 0.12);
    --fold-bg: #1c222b;
    --range: #4493f8;
    --mention: rgba(187, 128, 9, 0.40);
    --warn-fg: #d29922;
    --warn-bg: rgba(187, 128, 9, 0.15);
    --ok-fg: #3fb950;
    --badge-bg: #262c36;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--sans);
  display: flex;
  flex-direction: column;
}
button {
  font: inherit;
  font-size: 12px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 10px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--bg-soft); border-color: var(--fg-faint); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code { font-family: var(--mono); font-size: 0.92em; }

/* ---------- message screens ---------- */
.message {
  margin: 15vh auto 0;
  max-width: 640px;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-soft);
}
.message.error { border-color: var(--del-fg); }
.message pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }

/* ---------- header ---------- */
header.top {
  flex: none;
  border-bottom: 1px solid var(--border);
  background: var(--bg-header);
  padding: 8px 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 16px;
  align-items: center;
  position: relative;
}
.title-block h1 { font-size: 16px; margin: 0; }
.meta { color: var(--fg-muted); font-size: 12px; }
.nav { display: flex; gap: 8px; align-items: center; justify-self: end; }
.nav .pos { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
.counts { color: var(--fg-muted); font-size: 12px; }
.counts b { color: var(--fg); font-weight: 600; }
.header-right { display: flex; gap: 12px; align-items: center; justify-self: end; }
.warn-toggle { color: var(--warn-fg); border-color: var(--warn-fg); background: var(--warn-bg); }
.warn-toggle.none { color: var(--fg-muted); border-color: var(--border); background: var(--bg); }
.disclaimer {
  grid-column: 1 / -1;
  font-size: 12px;
  color: var(--fg-muted);
  font-style: italic;
}
.warn-panel {
  position: absolute;
  right: 16px;
  top: 100%;
  z-index: 20;
  width: min(720px, calc(100vw - 32px));
  max-height: 60vh;
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  padding: 6px 0;
  margin: 4px 0 0;
  list-style: none;
}
.warn-panel li { padding: 6px 12px; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.warn-panel li.clickable { cursor: pointer; }
.warn-panel li.clickable:hover, .warn-panel li.clickable:focus-visible { background: var(--bg-soft); }
.warn-panel li::before { content: "⚠ "; color: var(--warn-fg); }

/* ---------- panes ---------- */
main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
}
.pane { overflow: auto; min-height: 0; }
.pane.spec-pane { border-right: 1px solid var(--border); background: var(--bg); }
.pane.detail-pane { padding: 16px; }
@media (max-width: 900px) {
  body { height: auto; display: block; }
  html, body { height: auto; }
  header.top { grid-template-columns: 1fr; }
  .nav, .header-right { justify-self: start; flex-wrap: wrap; }
  main { display: block; }
  .pane.spec-pane { max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .pane.detail-pane { overflow: visible; }
}

/* ---------- spec (left) ---------- */
.spec {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
  padding: 8px 0 24px;
}
.sline {
  display: grid;
  grid-template-columns: 1.6em 3.4em minmax(0, 1fr);
}
.sgut { text-align: center; font-weight: 700; user-select: none; }
.sgut .st-reviewed { color: var(--ok-fg); }
.sgut .st-attention { color: var(--warn-fg); }
.sno {
  text-align: right;
  padding-right: 10px;
  color: var(--fg-faint);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.stext { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 12px; min-height: 1.6em; }
.sline.heading .stext { font-weight: 700; }
.seg.unlinked { color: var(--fg-muted); }
.seg.linked { background: var(--link-tint); cursor: pointer; border-radius: 2px; }
.seg.linked:hover { background: var(--link-tint-hover); }
.seg.linked.sel { background: var(--sel-tint); outline: 1px solid var(--accent); }
/* Two passages sharing a line: mark the boundary without adding characters. */
.seg.linked + .seg.linked { box-shadow: inset 2px 0 0 var(--accent); }

/* ---------- detail (right) ---------- */
.el-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.el-id { font-family: var(--mono); font-weight: 700; font-size: 14px; }
.review { display: flex; gap: 6px; }
.review button[aria-pressed="true"].rv-reviewed { background: var(--ok-fg); border-color: var(--ok-fg); color: #fff; }
.review button[aria-pressed="true"].rv-attention { background: var(--warn-fg); border-color: var(--warn-fg); color: #fff; }
.el-text {
  margin: 0 0 10px;
  padding: 8px 12px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
.badge {
  display: inline-block;
  font-size: 11px;
  line-height: 18px;
  padding: 0 7px;
  border-radius: 9px;
  background: var(--badge-bg);
  color: var(--fg-muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.badge.b-new { color: var(--add-fg); }
.badge.b-deleted { color: var(--del-fg); }
.badge.b-limited { color: var(--warn-fg); }
h2.section {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-muted);
  margin: 18px 0 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.none-linked { color: var(--fg-muted); font-style: italic; margin: 4px 0; }

.fileblock { border: 1px solid var(--border); border-radius: 6px; margin: 0 0 12px; background: var(--bg); }
.fhead {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 6px 10px;
  background: var(--bg-soft);
  border-radius: 6px 6px 0 0;
  border-bottom: 1px solid var(--border);
}
.fileblock.closed .fhead { border-bottom: 0; border-radius: 6px; }
.chev { border: 0; background: none; padding: 0 4px; font-size: 12px; color: var(--fg-muted); }
.fpath { font-family: var(--mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.fsym { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.fhead .spacer { flex: 1; }
.fnote { flex-basis: 100%; font-size: 12px; padding: 2px 0 0 22px; }
.fnote.warn { color: var(--warn-fg); }
.fnote.info { color: var(--fg-muted); }
.fbody { overflow-x: auto; }
.fileblock.closed .fbody { display: none; }
.fmsg { padding: 10px 12px; color: var(--fg-muted); font-size: 13px; }

table.diff {
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 20px;
  min-width: 100%;
  tab-size: 4;
  -moz-tab-size: 4;
}
table.diff td { padding: 0; vertical-align: top; }
td.ln {
  width: 1%;
  min-width: 44px;
  padding: 0 8px;
  text-align: right;
  color: var(--fg-faint);
  user-select: none;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
td.mk { width: 1%; padding: 0 6px 0 10px; user-select: none; white-space: pre; }
td.code { white-space: pre; padding-right: 16px; }
tr.add td { background: var(--add-bg); }
tr.add td.ln { background: var(--add-ln); }
tr.add td.mk { color: var(--add-fg); }
tr.del td { background: var(--del-bg); }
tr.del td.ln { background: var(--del-ln); }
tr.del td.mk { color: var(--del-fg); }
tr.inrange td.ln:first-child { box-shadow: inset 3px 0 0 var(--range); }
tr.mention td.code { background-image: linear-gradient(var(--mention), var(--mention)); }
.nonl { color: var(--del-fg); font-size: 11px; padding-left: 8px; user-select: none; }
tr.hunk td { background: var(--hunk-bg); color: var(--fg-muted); padding: 0 8px; white-space: pre; }
tr.fold td, tr.gap td { background: var(--fold-bg); color: var(--fg-muted); padding: 0; }
.foldbar {
  position: sticky;
  left: 0;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 2px 10px;
  font-family: var(--sans);
  font-size: 12px;
  white-space: nowrap;
}
.foldbar button { padding: 0 8px; line-height: 18px; }
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<script type="application/json" id="mapping-data">/*MAPPING_JSON*/</script>
<script type="application/json" id="diff-data">/*CHANGES_DIFF*/</script>
<script type="application/json" id="meta-data">/*META_JSON*/</script>
<script>
"use strict";
(function () {

  // ======================================================================
  // DOM helper. Strings become text nodes; nothing is ever parsed as HTML.
  // ======================================================================
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
        var v = props[k];
        if (v === undefined || v === null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, child) {
    if (child === undefined || child === null || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    el.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  /** Inline text with `code` spans for message strings we compose ourselves. */
  function withCode(parts) {
    return parts.map(function (p, i) { return i % 2 ? h("code", { text: p }) : p; });
  }

  // ======================================================================
  // Data loading
  // ======================================================================
  var NOT_GENERATED = {};
  function readBlock(id) {
    var node = document.getElementById(id);
    var raw = node ? node.textContent : "";
    // An unreplaced placeholder is a JS-style comment, which no JSON value starts with.
    if (raw.trim().slice(0, 2) === "/*") return NOT_GENERATED;
    try {
      return JSON.parse(raw);
    } catch (e) {
      throw new Error("Could not parse #" + id + ": " + e.message);
    }
  }

  var app = document.getElementById("app");
  function showMessage(cls, children) {
    app.textContent = "";
    append(app, h("div", { class: "message " + cls }, children));
  }

  var mapping, diffText, meta;
  try {
    mapping = readBlock("mapping-data");
    diffText = readBlock("diff-data");
    meta = readBlock("meta-data");
    if (mapping === NOT_GENERATED || diffText === NOT_GENERATED || meta === NOT_GENERATED) {
      showMessage("", h("p", null, withCode([
        "This is the viewer template. Generate a review page with ",
        "python3 make-review.py mapping.json changes.diff", "."])));
      return;
    }
    if (!mapping || !Array.isArray(mapping.elements) || typeof diffText !== "string") {
      throw new Error("Embedded data has an unexpected shape.");
    }
  } catch (e) {
    showMessage("error", [h("p", { text: "The review data could not be loaded." }),
                          h("pre", { text: String(e && e.message || e) })]);
    return;
  }

  // ======================================================================
  // Diff parser → files with unified rows
  // ======================================================================
  var HUNK_RE = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$/;
  var ESC = { a: "\x07", b: "\b", f: "\f", n: "\n", r: "\r", t: "\t", v: "\v", '"': '"', "\\": "\\" };

  function unquotePath(raw) {
    raw = raw.trim();
    if (!(raw.length >= 2 && raw[0] === '"' && raw[raw.length - 1] === '"')) return raw;
    var body = raw.slice(1, -1), bytes = [], i = 0;
    var enc = new TextEncoder();
    while (i < body.length) {
      var c = body[i];
      if (c === "\\" && i + 1 < body.length) {
        var oct = /^[0-7]{3}/.exec(body.slice(i + 1, i + 4));
        if (oct) { bytes.push(parseInt(oct[0], 8)); i += 4; continue; }
        var n = body[i + 1];
        Array.prototype.push.apply(bytes, enc.encode(ESC[n] !== undefined ? ESC[n] : n));
        i += 2; continue;
      }
      Array.prototype.push.apply(bytes, enc.encode(c));
      i++;
    }
    return new TextDecoder().decode(new Uint8Array(bytes));
  }
  function stripPrefix(p, prefix) {
    if (p === "/dev/null") return null;
    return p.slice(0, prefix.length) === prefix ? p.slice(prefix.length) : p;
  }
  function splitGitHeader(rest) {
    rest = rest.trim();
    var m;
    if (rest[0] === '"' && (m = /^("(?:[^"\\]|\\.)*")\s+(.*)$/.exec(rest))) {
      return [stripPrefix(unquotePath(m[1]), "a/"), stripPrefix(unquotePath(m[2]), "b/")];
    }
    if (rest[rest.length - 1] === '"' && (m = /^(.*?)\s+("(?:[^"\\]|\\.)*")$/.exec(rest))) {
      return [stripPrefix(m[1], "a/"), stripPrefix(unquotePath(m[2]), "b/")];
    }
    var half = (rest.length - 1) >> 1;
    if (rest.length % 2 === 1 && rest[half] === " " &&
        rest.slice(2, half) === rest.slice(half + 3)) {
      return [stripPrefix(rest.slice(0, half), "a/"), stripPrefix(rest.slice(half + 1), "b/")];
    }
    var idx = rest.indexOf(" b/");
    if (idx > 0) return [stripPrefix(rest.slice(0, idx), "a/"), stripPrefix(rest.slice(idx + 1), "b/")];
    return [rest, rest];
  }

  function parseDiff(text) {
    var files = [];
    var lines = text.split("\n");
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    var i = 0, n = lines.length;
    while (i < n) {
      var line = lines[i].replace(/\r$/, "");
      if (line.slice(0, 11) !== "diff --git ") { i++; continue; }
      var paths = splitGitHeader(line.slice(11));
      var f = {
        oldPath: paths[0], newPath: paths[1], path: null,
        isNew: false, isDeleted: false, isRenamed: false, isBinary: false,
        hunks: [], rows: [], complete: true
      };
      files.push(f);
      i++;
      while (i < n) {
        line = lines[i].replace(/\r$/, "");
        if (line.slice(0, 11) === "diff --git ") break;
        var m = HUNK_RE.exec(line);
        if (m) {
          var hunk = {
            header: line,
            heading: m[5],
            oldStart: +m[1], oldCount: m[2] === undefined ? 1 : +m[2],
            newStart: +m[3], newCount: m[4] === undefined ? 1 : +m[4],
            start: f.rows.length, end: f.rows.length
          };
          f.hunks.push(hunk);
          var oldLeft = hunk.oldCount, newLeft = hunk.newCount;
          var oldNo = hunk.oldStart, newNo = hunk.newStart;
          i++;
          while (i < n && (oldLeft > 0 || newLeft > 0 || lines[i][0] === "\\")) {
            var row = lines[i], tag = row[0];
            if (tag === "\\") {
              if (f.rows.length > hunk.start) f.rows[f.rows.length - 1].noNewline = true;
            } else if (tag === "+") {
              f.rows.push({ type: "add", oldNo: null, newNo: newNo++, text: row.slice(1), hunk: f.hunks.length - 1 });
              newLeft--;
            } else if (tag === "-") {
              f.rows.push({ type: "del", oldNo: oldNo++, newNo: null, text: row.slice(1), hunk: f.hunks.length - 1 });
              oldLeft--;
            } else if (tag === " " || row === "") {
              f.rows.push({ type: "context", oldNo: oldNo++, newNo: newNo++, text: row.slice(1), hunk: f.hunks.length - 1 });
              oldLeft--; newLeft--;
            } else {
              break;
            }
            i++;
          }
          hunk.end = f.rows.length;
          continue;
        }
        if (line.indexOf("new file mode") === 0) f.isNew = true;
        else if (line.indexOf("deleted file mode") === 0) f.isDeleted = true;
        else if (line.indexOf("rename from ") === 0) { f.oldPath = unquotePath(line.slice(12)); f.isRenamed = true; }
        else if (line.indexOf("rename to ") === 0) { f.newPath = unquotePath(line.slice(10)); f.isRenamed = true; }
        else if (line.indexOf("--- ") === 0) {
          var a = stripPrefix(unquotePath(line.slice(4).split("\t")[0]), "a/");
          if (a === null) f.isNew = true; else f.oldPath = a;
        } else if (line.indexOf("+++ ") === 0) {
          var b = stripPrefix(unquotePath(line.slice(4).split("\t")[0]), "b/");
          if (b === null) f.isDeleted = true; else f.newPath = b;
        } else if (line.indexOf("Binary files ") === 0 || line === "GIT binary patch") {
          f.isBinary = true;
        }
        i++;
      }
    }
    files.forEach(function (f) {
      f.path = f.isDeleted ? f.oldPath : f.newPath;
      f.complete = isComplete(f);
    });
    return files;
  }

  function isComplete(f) {
    if (f.isNew || f.isDeleted || f.isBinary || !f.hunks.length) return true;
    if (f.hunks.length !== 1) return false;
    var hk = f.hunks[0];
    return hk.oldStart === (hk.oldCount === 0 ? 0 : 1) && hk.newStart === (hk.newCount === 0 ? 0 : 1);
  }

  // ======================================================================
  // Symbol location (§7)
  // ======================================================================
  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&"); }
  function symbolRe(symbol, flags) {
    return new RegExp("(?<![\\w$])" + escapeRe(symbol) + "(?![\\w$])", flags || "");
  }

  /**
   * Blank out (with spaces, keeping columns) everything that is not code:
   * strings, chars, text blocks, line and block comments. State carries across lines.
   */
  function codeOnly(texts) {
    var state = 0; // 0 code, 1 block comment, 2 text block
    return texts.map(function (t) {
      var out = [], i = 0, n = t.length;
      while (i < n) {
        var c = t[i];
        if (state === 1) {
          if (c === "*" && t[i + 1] === "/") { out.push("  "); i += 2; state = 0; } else { out.push(" "); i++; }
          continue;
        }
        if (state === 2) {
          if (c === "\\") { out.push("  "); i += 2; continue; }
          if (t.substr(i, 3) === '"""') { out.push("   "); i += 3; state = 0; } else { out.push(" "); i++; }
          continue;
        }
        if (c === "/" && t[i + 1] === "/") { out.push(" ".repeat(n - i)); break; }
        if (c === "/" && t[i + 1] === "*") { out.push("  "); i += 2; state = 1; continue; }
        if (t.substr(i, 3) === '"""') { out.push("   "); i += 3; state = 2; continue; }
        if (c === '"' || c === "'") {
          out.push(" "); i++;
          while (i < n && t[i] !== c) {
            if (t[i] === "\\") { out.push(" "); i++; }
            if (i < n) { out.push(" "); i++; }
          }
          if (i < n) { out.push(" "); i++; }
          continue;
        }
        out.push(c); i++;
      }
      var s = out.join("");
      return s.length > n ? s.slice(0, n) : s;
    });
  }

  var NOT_DECL_BEFORE = /(?:^|[^\w$])(?:new|return|throw|else|case|await|yield|typeof|in|of|do)\s*$/;
  var TYPE_DECL_BEFORE = /(?:(?:^|[^\w$@])(?:class|interface|enum|record)|@interface)\s+$/;

  function looksLikeDeclaration(code, start, end) {
    var before = code.slice(0, start), after = code.slice(end);
    if (TYPE_DECL_BEFORE.test(before)) return true;
    if (!/^\s*\(/.test(after)) return false;
    if (NOT_DECL_BEFORE.test(before)) return false;
    var prev = before.replace(/\s+$/, "");
    if (prev === "") return true;
    return /[\w$>\])]/.test(prev[prev.length - 1]);

  var LEADING_DECOR = /^\s*(?:@|\/\/|\/\*|\*)/;

  /** Returns { mode: "decl", ranges, side } or { mode: "fallback", mentions, found }. */
  function locateSymbol(file, symbol) {
    var re = symbolRe(symbol);
    var reG = symbolRe(symbol, "g");
    var mentions = new Set();
    file.rows.forEach(function (r, idx) { if (re.test(r.text)) mentions.add(idx); });
    var inHeading = file.hunks.some(function (hk) { return re.test(hk.heading); });

    var sides = [["context", "add"], ["context", "del"]];
    for (var s = 0; s < sides.length; s++) {
      var keep = sides[s], ranges = [];
      file.hunks.forEach(function (hk) {
        var idxs = [];
        for (var u = hk.start; u < hk.end; u++) if (keep.indexOf(file.rows[u].type) >= 0) idxs.push(u);
        if (!idxs.length) return;
        var texts = idxs.map(function (u) { return file.rows[u].text; });
        var codes = codeOnly(texts);
        for (var k = 0; k < idxs.length; k++) {
          if (!mentions.has(idxs[k])) continue;
          reG.lastIndex = 0;
          var m;
          while ((m = reG.exec(codes[k]))) {
            if (!looksLikeDeclaration(codes[k], m.index, m.index + m[0].length)) continue;
            var range = declarationRange(texts, codes, k, m.index + m[0].length);
            if (range) ranges.push([idxs[range[0]], idxs[range[1]]]);

      });
      if (ranges.length) return { mode: "decl", ranges: mergeRanges(ranges), side: s === 0 ? "new" : "old" };
    }
    return { mode: "fallback", mentions: mentions, found: mentions.size > 0 || inHeading };
  }

  /** From a declaration at codes[k] (symbol ending at col), find [startK, endK] or null. */
  function declarationRange(texts, codes, k, col) {
    // Forward to the first "{" or ";".
    var bk = -1, bc = -1;
    outer:
    for (var r = k, c = col; r < codes.length; r++, c = 0) {
      for (; c < codes[r].length; c++) {
        var ch = codes[r][c];
        if (ch === ";") return null;
        if (ch === "{") { bk = r; bc = c; break outer; }

    }
    if (bk < 0) return null;
    // Match braces.
    var depth = 0, endK = codes.length - 1;
    match:
    for (r = bk, c = bc; r < codes.length; r++, c = 0) {
      for (; c < codes[r].length; c++) {
        ch = codes[r][c];
        if (ch === "{") depth++;

      }
    }
    // Back over annotations and comments directly above.
    var startK = k;
    while (startK > 0 && LEADING_DECOR.test(texts[startK - 1])) startK--;

  function mergeRanges(ranges) {
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var out = [];
    ranges.forEach(function (r) {
      var last = out[out.length - 1];

      else out.push([r[0], r[1]]);

  // ======================================================================
  // Folding model (§8)
  // ======================================================================
  var STEP = 20, MIN_FOLD = 3, NEW_FILE_LIMIT = 400, FALLBACK_CONTEXT = 3;

  function initialVisibility(file, loc) {
    var vis = new Uint8Array(file.rows.length);
    if (loc.mode === "decl") {
      loc.ranges.forEach(function (r) { for (var i = r[0]; i <= r[1]; i++) vis[i] = 1; });
    } else if (file.isNew || file.isDeleted) {
      for (var i = 0; i < Math.min(NEW_FILE_LIMIT, vis.length); i++) vis[i] = 1;
    } else {

  /** Hidden stretches of MIN_FOLD rows or fewer are just shown. */

  }

  // ======================================================================
  // Model
  // ======================================================================
  var files = parseDiff(diffText);
  var fileByPath = new Map();
  files.forEach(function (f) { if (!fileByPath.has(f.path)) fileByPath.set(f.path, f); });

  var elements = mapping.elements;
  var KINDS = ["tests", "implementation"];
  var linked = [];
  elements.forEach(function (el, i) {
    el._index = i;

  var review = new Map(); // element index → "reviewed" | "attention"
  var entries = new Map(); // "el:kind:ref" → per-reference view state

  var locCache = new Map();
  function locate(file, symbol) {

  // Warnings, worded like the generator's.

  elements.forEach(function (el, i) {

        var file = fileByPath.get(ref.file);
        if (!file) {

        } else if (!symbolFound(file, ref.symbol)) {

  if (!linked.length) warnings.push({ el: null, text: "no linked elements" });

  function symbolFound(file, symbol) {

  }

  var selected = linked.length ? linked[0] : null;

  // ======================================================================
  // Layout
  // ======================================================================
  var title = typeof mapping.title === "string" && mapping.title ? mapping.title : "Spec review";
  document.title = title + " · Spec review";

  var posLabel = h("span", { class: "pos" });
  var prevBtn = h("button", { type: "button", onclick: function () { step(-1); } }, "◀ Previous");
  var nextBtn = h("button", { type: "button", onclick: function () { step(1); } }, "Next ▶");

      li.addEventListener("click", go);
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }

    warnPanel.appendChild(li);
  });

  var metaText = [];
  if (meta && meta.generatedAt) metaText.push("Generated " + formatDate(meta.generatedAt));
  if (meta && (meta.mappingFile || meta.diffFile)) {
    metaText.push("from " + [meta.mappingFile, meta.diffFile].filter(Boolean).join(" + "));
  }

  var header = h("header", { class: "top" },
    h("div", { class: "title-block" },
      h("h1", { text: title }),
      h("div", { class: "meta", text: metaText.join(" ") })),
    h("div", { class: "nav" }, prevBtn, posLabel, nextBtn),
    countsEl,
    h("div", { class: "header-right" }, warnBtn),
    h("div", { class: "disclaimer", text:

  document.addEventListener("click", function (e) {

  // ======================================================================

  // ======================================================================
  var segsByEl = elements.map(function () { return []; });
  var markerByEl = new Map();

  (function renderSpec() {
    // Split the concatenated text into lines of [elementIndex, text] segments.
    var lines = [[]];
    elements.forEach(function (el, i) {
      el.text.split("\n").forEach(function (piece, p) {
        if (p > 0) lines.push([]);

        var span = h("span", { class: "seg " + (el._linked ? "linked" : "unlinked"), text: s[1] });
        if (el._linked) {
          span.addEventListener("click", function () { select(el._index); });

            span.setAttribute("role", "button");
            span.setAttribute("aria-label", "Select " + el.id);
            span.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(el._index); }

            gut.appendChild(mk);
            markerByEl.set(el._index, mk);
          }
        }

        body.appendChild(span);

        gut, h("span", { class: "sno", text: String(ln + 1) }), body));

  // ======================================================================
  // Selection, navigation, counts, review state
  // ======================================================================
  function select(i) {
    if (i === null || !elements[i] || !elements[i]._linked) return;
    if (selected !== null) segsByEl[selected].forEach(function (s) { s.classList.remove("sel"); });
    selected = i;
    segsByEl[i].forEach(function (s) { s.classList.add("sel"); });
    var first = segsByEl[i][0];

  function scrollIntoPane(node, pane) {
    var pr = pane.getBoundingClientRect(), nr = node.getBoundingClientRect();
    if (pane.scrollHeight > pane.clientHeight + 1) {

  }

  function renderHeaderState() {
    var pos = linked.indexOf(selected);
    posLabel.textContent = (pos + 1) + " / " + linked.length;
    prevBtn.disabled = pos <= 0;
    nextBtn.disabled = pos < 0 || pos >= linked.length - 1;

    var noTests = 0, noImpl = 0, nReviewed = 0, nAttention = 0;
    linked.forEach(function (i) {
      if (!elements[i].tests.length) noTests++;
      if (!elements[i].implementation.length) noImpl++;
      var st = review.get(i);
      if (st === "reviewed") nReviewed++;
      if (st === "attention") nAttention++;

    countsEl.textContent = "";
    append(countsEl, [
      h("b", { text: String(linked.length) }), linked.length === 1 ? " linked passage" : " linked passages",
      " · ", h("b", { text: String(noTests) }), " without tests",
      " · ", h("b", { text: String(noImpl) }), " without implementation",
      " · Reviewed ", h("b", { text: String(nReviewed) }),
      " · Needs attention ", h("b", { text: String(nAttention) })

    markerByEl.forEach(function (mk, i) {
      var st = review.get(i);
      mk.className = st === "reviewed" ? "st-reviewed" : st === "attention" ? "st-attention" : "";
      mk.textContent = st === "reviewed" ? "✓" : st === "attention" ? "!" : "";
      mk.title = st === "reviewed" ? "Reviewed" : st === "attention" ? "Needs attention" : "";
    });
  }

  function setReview(i, state) {
    if (review.get(i) === state) review.delete(i); else review.set(i, state);
    renderHeaderState();
    renderDetail();
  }

  // ======================================================================
  // Detail pane
  // ======================================================================
  function renderDetail() {
    detailPane.textContent = "";
    if (selected === null) {
      detailPane.appendChild(h("p", { class: "none-linked", text: "No linked passages in this mapping." }));
      return;
    }
    var el = elements[selected];
    var st = review.get(selected);
    var reviewedBtn = h("button", {
      type: "button", class: "rv-reviewed", "aria-pressed": String(st === "reviewed"),
      onclick: function () { setReview(el._index, "reviewed"); }
    }, "✓ Reviewed");

      onclick: function () { setReview(el._index, "attention"); }
    }, "! Needs attention");

    append(detailPane, [
      h("div", { class: "el-head" },
        h("span", { class: "el-id", text: el.id }),
        h("div", { class: "review", role: "group", "aria-label": "Review status" }, reviewedBtn, attentionBtn)),
      h("pre", { class: "el-text", text: el.text })
    ]);
    var badges = [];
    if (!el.tests.length) badges.push(h("span", { class: "badge", text: "no tests linked" }));
    if (!el.implementation.length) badges.push(h("span", { class: "badge", text: "no implementation linked" }));
    if (badges.length) detailPane.appendChild(h("div", { class: "badges" }, badges));

    KINDS.forEach(function (kind) {
      detailPane.appendChild(h("h2", { class: "section", text: kind === "tests" ? "Tests" : "Implementation" }));
      if (!el[kind].length) {

        return;

      el[kind].forEach(function (ref, j) {

      });
    });
  }

  function getEntry(el, kind, j, ref) {
    var key = el._index + ":" + kind + ":" + j;
    var entry = entries.get(key);
    if (!entry) {
      var file = fileByPath.get(ref.file) || null;
      entry = { file: file, open: true };
      if (file && file.rows.length) {
        entry.loc = locate(file, ref.symbol);
        entry.initial = initialVisibility(file, entry.loc);
        entry.vis = entry.initial.slice();
        entry.inRange = new Uint8Array(file.rows.length);
        if (entry.loc.mode === "decl") {
          entry.loc.ranges.forEach(function (r) { for (var i = r[0]; i <= r[1]; i++) entry.inRange[i] = 1; });
        }

    if (file.isDeleted) head.appendChild(h("span", { class: "badge b-deleted", text: "deleted file" }));
    if (file.isRenamed) head.appendChild(h("span", { class: "badge", text: "renamed", title: "from " + file.oldPath }));
    if (!file.complete) head.appendChild(h("span", { class: "badge b-limited", text: "limited context" }));

    }

    } else if (loc.side === "old") {

    }

      for (var i = 0; i < entry.vis.length; i++) if (!entry.vis[i]) return false;
      return true;
    }
    function initialIsAll() {
      for (var i = 0; i < entry.initial.length; i++) if (!entry.initial[i]) return false;
      return true;
    }

      body.appendChild(renderDiff(file, entry, update));

  }

  function renderDiff(file, entry, update) {
    var tbody = h("tbody");
    var table = h("table", { class: "diff" }, tbody);
    var mentions = entry.loc.mode === "fallback" ? entry.loc.mentions : null;
    var useOld = file.isDeleted;
    var prevEnd = 0; // last line number (on the numbering side) covered so far

    var runs = new Map();
    hiddenRuns(file, entry.vis).forEach(function (r) { runs.set(r[0], r[1]); });

    file.hunks.forEach(function (hk) {
      var start = useOld ? hk.oldStart : hk.newStart;
      var count = useOld ? hk.oldCount : hk.newCount;
      if (!file.complete && start > prevEnd + 1) {
        tbody.appendChild(h("tr", { class: "gap" }, h("td", { colspan: "4" },
          h("span", { class: "foldbar", text: (start - 1 === prevEnd + 1
            ? "⋯ line " + (start - 1)
            : "⋯ lines " + (prevEnd + 1) + "–" + (start - 1)) + " not in diff ⋯" }))));
      }

      for (var u = hk.start; u < hk.end; u++) {

        var r = file.rows[u];
        var cls = r.type === "add" ? "add" : r.type === "del" ? "del" : "ctx";
        if (entry.inRange[u]) cls += " inrange";
        if (mentions && mentions.has(u)) cls += " mention";
        var code = h("td", { class: "code" }, r.text);
        if (r.noNewline) code.appendChild(h("span", { class: "nonl", text: "⊘ no newline at end of file" }));
        tbody.appendChild(h("tr", { class: cls },
          h("td", { class: "ln", text: r.oldNo === null ? "" : String(r.oldNo) }),
          h("td", { class: "ln", text: r.newNo === null ? "" : String(r.newNo) }),
          h("td", { class: "mk", text: r.type === "add" ? "+" : r.type === "del" ? "-" : " " }),
          code));
      }
    });
    return table;
  }

  function foldRow(file, entry, start, end, update) {
    var n = end - start, changed = 0;
    for (var i = start; i < end; i++) if (file.rows[i].type !== "context") changed++;
    function reveal(from, to) {
      for (var i = from; i < to; i++) entry.vis[i] = 1;
      normalize(file, entry.vis);
      update();
    }
    var bar = h("span", { class: "foldbar" },
      "⋯ " + n + (n === 1 ? " line" : " lines") + " hidden" + (changed ? " (" + changed + " changed)" : "") + " ⋯");
    if (n > STEP) {
      bar.appendChild(h("button", { type: "button", title: "Show " + STEP + " more lines above the next block",
        onclick: function () { reveal(end - STEP, end); } }, "↑ " + STEP));
      bar.appendChild(h("button", { type: "button", title: "Show " + STEP + " more lines below the previous block",
        onclick: function () { reveal(start, start + STEP); } }, "↓ " + STEP));
    }
    bar.appendChild(h("button", { type: "button", onclick: function () { reveal(start, end); } }, "Show all"));
    return h("tr", { class: "fold" }, h("td", { colspan: "4" }, bar));
  }

  // ======================================================================
  // Start
  // ======================================================================
  renderHeaderState();
  if (selected !== null) select(selected); else renderDetail();
})();
</script>
</body>
</html>
